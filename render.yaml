services:
  - type: web
    name: nexus-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@nexus.edu
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
